<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming soon — Yaan</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .soon{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 480px at 85% -10%,var(--b100),transparent 60%),radial-gradient(600px 400px at -5% 90%,#e7f6f3,transparent 60%)}
  .soon-card{width:100%;max-width:560px;background:#fff;border:1px solid var(--border);border-radius:24px;padding:40px 32px;text-align:center;box-shadow:var(--shadow)}
  .soon-card .logo{justify-content:center;margin-bottom:26px}
  .soon-card img.art{display:block;width:100%;height:auto;border-radius:14px;margin-bottom:26px}
  .soon-card h1{font-size:clamp(1.9rem,5vw,2.6rem)}
  .soon-card h1 em{font-style:normal;color:var(--b600)}
  .soon-card p{color:var(--muted)}
  .soon-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
</style>
</head>
<body>
<main class="soon">
  <div class="soon-card">
    <a href="index.html" class="logo"><img src="favicon.svg" alt="" width="30" height="30"><span>Yaan</span></a>
    <img class="art" src="images/commute-scene.svg" alt="" width="1200" height="440">
    <span class="pill">Login portal</span>
    <h1>Coming <em>soon</em></h1>
    <p>We're putting the finishing touches on the Yaan login. Meanwhile, we'd love to show you the platform in action.</p>
    <div class="soon-actions">
      <a href="index.html#contact" class="btn btn-primary">Book a demo</a>
      <a href="index.html" class="btn btn-ghost">← Back to home</a>
    </div>
  </div>
</main>
</body>
</html>
